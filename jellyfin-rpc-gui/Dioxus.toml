#:schema https://raw.githubusercontent.com/DioxusLabs/dioxus/v0.7.10/packages/cli/schema.json
[application]
name = "jellyfin-rpc-gui"
out_dir = "dist"
default_platform = "desktop"
asset_dir = "assets"

[web.app]
title = "Jellyfin-RPC"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
style = []
script = []

[web.resource.dev]
style = []
script = []

[bundle]
product_name = "Jellyfin-RPC"
identifier = "io.github.levisnoot.jellyfin-rpc"
publisher = "LeviSnoot"
icon = [
    "img/icons/32x32.png",
    "img/icons/128x128.png",
    "img/icons/icon.icns",
    "img/icons/icon.ico",
]
category = "Utility"
short_description = "Jellyfin-RPC Tray Agent"
long_description = "Jellyfin-RPC shows what you're watching or listening to on Jellyfin as Discord Rich Presence. This app provides a system-tray agent and GUI for configuring it."

# [bundle.windows.nsis]
# installer_icon = "img/icons/icon.ico"
# header_image = "img/resources/nsis_header.bmp"
# sidebar_image = "img/resources/nsis_sidebar.bmp"

# [bundle.windows.wix]
# banner_path = "img/resources/wix_banner.bmp"
# dialog_image_path = "img/resources/wix_dialog.bmp"

[bundle.windows.webview_install_mode.EmbedBootstrapper]
silent = true

[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libjavascriptcoregtk-4.1-0", "libgtk-3-0", "libayatana-appindicator3-1", "libssl3t64"]

[bundle.rpm]
depends = ["webkit2gtk4.1", "javascriptcoregtk4.1", "gtk3", "libayatana-appindicator-gtk3", "openssl-libs"]
