[package]
name         = "jellyfin-rpc-gui"
version      = "1.4.0"
edition      = "2021"
description  = "Tray agent and GUI for configuring Jellyfin-RPC"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/LeviSnoot/jellyfin-rpc"
keywords     = ["gui", "tray", "jellyfin", "discord", "rich-presence"]

[[bin]]
name = "jellyfin-rpc-gui"
path = "src/main.rs"

[dependencies]
log           = "0.4"
simple_logger = "5.0"
serde_json    = "1.0"

[dependencies.jellyfin-rpc]
path    = "../jellyfin-rpc"
version = "1.4.0"

[dependencies.dioxus]
version  = "0.7"
features = ["desktop"]

[dependencies.dioxus-desktop]
version = "0.7"

[dependencies.dioxus-primitives]
git = "https://github.com/DioxusLabs/components"

[dependencies.dioxus-icons]
version = "0.1"

[dependencies.clap]
features = ["derive"]
version  = "4.5"

[dependencies.sysinfo]
version          = "0.40"
default-features = false
features         = ["system"]

[dependencies.tokio]
version  = "1"
features = ["rt", "rt-multi-thread", "sync", "time"]
